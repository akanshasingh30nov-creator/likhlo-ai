[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "likhlo-ai"
version = "1.0.0"
description = "Bhaiya, Likh Lo! Voice-First AI Khata & Ledger Copilot for 63M+ Micro-Merchants"
readme = "README.md"
authors = [
  { name = "Akansha Singh", email = "akanshasingh@alumni.upenn.edu" }
]
license = "MIT"
requires-python = ">=3.10"
keywords = [
  "voice-ai",
  "fintech",
  "fastapi",
  "whisper",
  "india",
  "retail-tech",
  "sqlite-wal",
  "khata",
  "upi"
]
dependencies = [
  "fastapi>=0.100.0",
  "uvicorn>=0.22.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.0.0",
  "sqlalchemy>=2.0.0",
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "httpx>=0.24.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "flake8>=6.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["likhlo_ai*"]
exclude = ["assets*", "frontend*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
